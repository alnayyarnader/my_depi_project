# ansible/inventories/production/group_vars/all/vars.yml
---
app_name: "depi-3tier-app"
db_name: "app_db"
db_user: "postgres"
# Reference the encrypted variable from secrets.yml:
db_password: "{{ vault_db_password }}"
# to be changed in testing or staging or dev folder in the file >> inventories/(production)/group_vars/all/vars.yaml
app_environment: production
