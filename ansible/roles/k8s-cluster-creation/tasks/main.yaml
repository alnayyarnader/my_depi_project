- name: Render Kind config template to resolve the app_environment variable at kind-config.yaml
  ansible.builtin.template:
    src: kind-config.yaml
    dest: /tmp/kind-config.yaml

- name: Get list of existing Kind clusters
  ansible.builtin.shell: kind get clusters
  register: existing_clusters
  changed_when: false

- name: Create Kind cluster using config file
  ansible.builtin.command:
    cmd: "kind create cluster --config=/tmp/kind-config.yaml"
  when: existing_clusters.stdout | trim == ""
  changed_when: true


- name: Deploy Nginx Ingress Controller
  kubernetes.core.k8s:
    state: present
    src: https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

- name: Apply Namespace
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'namespace.yaml') | from_yaml }}"

- name: Apply ConfigMap
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'config.yaml') | from_yaml }}"

- name: Apply Secrets
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'secrets.yaml') | from_yaml }}"


- name: Deploy Rancher Local Path Provisioner
  ansible.builtin.command:
    cmd: kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.28/deploy/local-path-storage.yaml
  register: local_path_apply
  changed_when: "'created' in local_path_apply.stdout or 'configured' in local_path_apply.stdout"

- name: Verify Local Path storage class is created
  ansible.builtin.command:
    cmd: kubectl get storageclass local-path
  register: sc_check
  changed_when: false

- name: Display storage class status
  ansible.builtin.debug:
    msg: "{{ sc_check.stdout }}"
