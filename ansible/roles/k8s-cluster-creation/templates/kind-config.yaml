kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: "{{ app_environment }}-cluster"

nodes:

  - role: control-plane
    image: kindest/node:v1.33.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP

  - role: worker
    image: kindest/node:v1.33.0
