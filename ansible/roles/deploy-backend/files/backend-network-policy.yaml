apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-backend
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: backend           # Applies only to the backend pods
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend      # ONLY allow incoming traffic from pods labeled 'frontend'
    ports:
    - protocol: TCP
      port: 5000
