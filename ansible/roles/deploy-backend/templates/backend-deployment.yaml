apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: "{{ app_environment }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: your-backend-image:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: "{{ app_environment }}-configmap"
        - secretRef:
            name: "{{ app_environment }}-secrets"
