apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-netpol
  namespace: "{{ app_environment }}"
spec:
  podSelector:
    matchLabels:
      app: backend    # Applies only to the backend pods
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend    # ONLY allow incoming traffic from pods labeled 'frontend'
    ports:
    - protocol: TCP
      port: {{ backend_port }}
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: database  # ONLY allow outgoing traffic to pods labeled 'database'
    ports:
    - protocol: TCP
      port: {{ db_port }}


  # --- DNS Resolution without external naming ---
  - to:
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
