- name: Update apt cache and install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Ensure Docker keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker repository using modern deb822 format
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Install Docker Scout CLI plugin
  ansible.builtin.shell: |
    curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s -- -b /usr/libexec/docker/cli-plugins
  args:
    creates: /usr/libexec/docker/cli-plugins/docker-scout


- name: Add remote SSH user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_env.SUDO_USER | default('ubuntu') }}"
    groups: docker
    append: true



- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Verify Docker installation, permissions, and plugins
  ansible.builtin.shell: |
    echo "=== 1. Installed Packages ==="
    dpkg -l | grep docker
    echo "=== 2. Docker Group Membership ==="
    getent group docker
    echo "=== 3. Binary Path ==="
    which docker
    echo "=== 4. Docker Version ==="
    docker --version
    echo "=== 5. Service Status ==="
    sudo systemctl status docker --no-pager
    echo "=== 6. Docker Scout Version ==="
    docker scout version
  register: docker_verification_result
  changed_when: false

- name: Display verification output
  ansible.builtin.debug:
    var: docker_verification_result.stdout_lines
