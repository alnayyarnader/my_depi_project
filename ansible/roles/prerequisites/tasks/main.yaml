- name: Update apt cache and install base prerequisites and Python tools
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-pip
      - python3-setuptools
    state: present
    update_cache: true
  become: true


- name: Install Python Kubernetes client library
  ansible.builtin.pip:
    name: kubernetes
    executable: pip3
    state: present
    extra_args: "--break-system-packages"
  become: true


- name: Ensure Docker keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  become: true

- name: Add Docker repository using modern deb822 format
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  become: true

- name: Install Docker engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

- name: Install Docker Scout CLI plugin
  ansible.builtin.shell: |
    curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s -- -b /usr/libexec/docker/cli-plugins
  args:
    creates: /usr/libexec/docker/cli-plugins/docker-scout
  become: true

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true

- name: Add the configured ansible user as per group_vars/all.yaml to the docker group
  ansible.builtin.shell: |
    usermod -aG docker {{ ansible_user }}
  become: true
  changed_when: true

- name: Reset SSH connection to apply new group permissions
  ansible.builtin.meta: reset_connection

- name: Download and install Kind binary (v0.33.0)
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64"
    dest: /usr/local/bin/kind
    mode: '0755'
    force: false
  become: true

- name: Download and install Kubectl binary (Latest Stable)
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'
    force: false
  become: true


- name: Verify Docker, Kind, and Kubectl installation (validate Non-Root access)
  ansible.builtin.shell: |
    echo "=== 1. Current User Context ==="
    whoami
    groups
    
    echo "=== 2. Installed Packages ==="
    dpkg -l | grep docker
    
    echo "=== 3. Docker Group Membership ==="
    getent group docker
    
    echo "=== 4. Docker Daemon Access (Docker PS) ==="
    docker ps
    
    echo "=== 5. Binary Paths & Versions ==="
    which docker
    docker --version
    docker scout version
    kind version
    kubectl version --client
    
    echo "=== 6. Service Status ==="
    systemctl status docker --no-pager
  register: verification_results
  changed_when: false
  become: false

- name: Display comprehensive verification output
  ansible.builtin.debug:
    var: verification_results.stdout_lines
