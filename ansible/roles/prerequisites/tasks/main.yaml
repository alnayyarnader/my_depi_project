- name: Run prerequisite checks and system updates
  ansible.builtin.shell: |
    echo "Starting system prerequisite checks..."
    sudo apt-get update -y
    sudo apt-get install -y curl apt-transport-https ca-certificates gnupg

- name: Run docker installation script
  ansible.builtin.script: setup-docker.bash
  args:
    executable: /bin/bash
  register: docker_script_result

- name: Display Docker script output
  ansible.builtin.debug:
    var: docker_script_result.stdout

- name: Run installation script of kind and kubectl
  ansible.builtin.script: setup-kind.sh
  register: kind_script_result

- name: Display Kind and kubectl script output
  ansible.builtin.debug:
    var: kind_script_result.stdout
