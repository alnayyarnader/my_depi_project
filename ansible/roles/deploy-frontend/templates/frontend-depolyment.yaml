apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: "{{ app_environment }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: alnayyarnader/depi-frontend:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: "{{ app_environment }}-configmap"
        - secretRef:
            name: "{{ app_environment }}-secrets"
