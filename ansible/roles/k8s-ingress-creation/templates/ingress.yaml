apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ app_environment }}-ingress"
  namespace: "{{ app_environment }}"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80
