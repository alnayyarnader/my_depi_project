apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-netpol
  namespace: "{{ app_environment }}"
spec:
  podSelector:
    matchLabels:
      app: database   # Applies only to the database pods
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend   # ONLY allow incoming traffic from pods labeled 'backend'
    ports:
    - protocol: TCP
      port: 5432
