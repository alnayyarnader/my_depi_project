apiVersion: v1
kind: Service
metadata:
  name: my-svc
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
    - port: 80          # The port the service exposes inside the cluster
      targetPort: 80    # The port the container is listening on
      nodePort: 30007   # The host port you will use to access it (must be 30000-32767)
