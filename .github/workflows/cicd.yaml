name: cicd
 
on:
  push:
    branches: 
      - "*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select Target Infrastructure'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev
      action:
        description: 'Choose Infrastructure Action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - status
          - destroy

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  TF_TOKEN_app_terraform_io: ${{ secrets.depi_terraform_API_TOKEN }}

jobs:

  build-and-push:
    if: github.event_name == 'push' || github.event.inputs.action == 'deploy'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    # Build and Push Backend Image
    - name: Build and Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/depi-backend:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/depi-backend:${{ github.sha }}

    # Build and Push Frontend Image
    - name: Build and Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/depi-frontend:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/depi-frontend:${{ github.sha }}


  provisioning-and-deployment:
    name: "Run Action: ${{ github.event.inputs.action || 'deploy' }}"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always() && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')

    steps:
      - name: 1. Checkout GitHub Repository
        uses: actions/checkout@v4

      - name: 2. Setup Terraform CLI
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: 3. Initialize Terraform & Fetch State from HCP Cloud
        working-directory: ./terraform
        run: |
          terraform init

      # =========================================================================
      # CHECK STATUS ONLY
      # =========================================================================
      - name: Check Detailed Infrastructure & Cost Status
        if: ${{ github.event.inputs.action == 'status' }}
        working-directory: ./terraform
        run: |
          echo "=== REFRESHING LIVE AWS DATA ==="
          terraform init
          terraform apply -refresh-only -auto-approve
          echo "=== GENERATING DETAILED INFRASTRUCTURE & COST REPORT ==="
          terraform output infrastructure_audit_report
           
      # =========================================================================
      # CLEAN UP / DESTROY ALL INFRASTRUCTURE
      # =========================================================================
      - name: Destroy All AWS Resources & Update HCP State
        if: ${{ github.event.inputs.action == 'destroy' }}
        working-directory: ./terraform
        run: |
          echo "Destroying all AWS resources tracked in HCP Terraform..."
          terraform destroy -auto-approve
          echo "All AWS infrastructure has been cleanly terminated!"

      # =========================================================================
      # DEPLOY INFRASTRUCTURE + ANSIBLE
      # =========================================================================
      - name: Provision AWS Infrastructure (Terraform Apply)
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve
          echo "EC2_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV

      - name: 5. Configure SSH Key for Ansible
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPI_LOCALLY_GENERATED_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 6. Inject EC2_IP into Ansible hosts.yaml & Wait for SSH
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
        env:
          TARGET_ENV: ${{ github.event.inputs.target_env || 'production' }}
        working-directory: ./ansible
        run: | 
          mkdir -p inventories/$TARGET_ENV
          cat << EOF > inventories/$TARGET_ENV/hosts.yaml
          all:
            hosts:
              ec2_server:
                ansible_host: $EC2_IP
          EOF
          echo "=== Updated inventories/$TARGET_ENV/hosts.yaml ==="
          cat inventories/$TARGET_ENV/hosts.yaml
          echo "Waiting for SSH port 22 on $EC2_IP..."
          timeout 120 bash -c "until nc -z -v -w5 $EC2_IP 22; do sleep 5; done"

      - name: 7. Run Ansible Playbook (Decrypt Vault in RAM)
        if: ${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}
        working-directory: ./ansible
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          TARGET_ENV: ${{ github.event.inputs.target_env || 'production' }}
        run: |
          echo "Targeting Environment: $TARGET_ENV"
          ansible-playbook playbooks/playbook.yaml \
            -i inventories/$TARGET_ENV/hosts.yaml \
            --private-key ~/.ssh/id_rsa \
            --vault-password-file <(echo "$VAULT_PASS")
