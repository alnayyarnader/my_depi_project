name: cicd
 
on:
  push:
    branches: 
      - "*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
 
jobs:
 
  build:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v6.1.0
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.3.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_QUBE }}

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@master
      with:
        pollingTimeoutSec: 600
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_QUBE }}
 
    - name: "Example show SonarQube Quality Gate Status value"
      run: echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"


  deploy:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v6.1.0

    - name: Provision AWS Infrastructure with Terraform
      working-directory: ./terraform
      run: |
         terraform init
         terraform apply -auto-approve
         #Save as a normal Linux environment variable for all future steps:
         echo "EC2_IP=$(terraform output -raw public_ip)" >> $GITHUB_ENV
         
    - name: Wait for EC2 SSH Port 22 to be Ready
      run: |
        #Use $EC2_IP directly like normal Bash!
        timeout 120 bash -c 'until nc -z -v -w5 $EC2_IP 22; do sleep 5; done'

