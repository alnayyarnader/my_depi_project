<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Data Logger</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 40px;
            background: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 650px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        .error { color: #d9534f; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Task Data Logger</h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Enter task name (e.g., Deploy Kubernetes Cluster)" />
            <button onclick="saveTask()">Save Task</button>
        </div>

        <h3>Saved Tasks:</h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Task Name</th>
                    <th style="width: 180px;">Timestamp (UTC)</th>
                </tr>
            </thead>
            <tbody id="records-body">
                <tr><td colspan="3">Loading records...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchRecords() {
            const tbody = document.getElementById('records-body');
            try {
                const response = await fetch('/api/records');
                if (!response.ok) throw new Error('Backend error');
                const records = await response.json();
                tbody.innerHTML = '';

                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No tasks logged yet.</td></tr>';
                    return;
                }

                records.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${r.id}</td>
                        <td>${escapeHtml(r.task_name)}</td>
                        <td>${r.saved_at}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="3" class="error">Could not connect to backend API.</td></tr>';
            }
        }

        async function saveTask() {
            const input = document.getElementById('taskInput');
            const task_name = input.value.trim();
            if (!task_name) {
                alert('Please enter a task name first!');
                return;
            }

            try {
                const response = await fetch('/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_name })
                });
                if (!response.ok) throw new Error('Failed to save task');
                input.value = '';
                fetchRecords();
            } catch (err) {
                alert('Failed to save task record.');
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        fetchRecords();
    </script>
</body>
</html>
