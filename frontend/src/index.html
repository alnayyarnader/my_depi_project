<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Tier Time Logger</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 40px; 
            background: #f4f4f9; 
            color: #333; 
        }
        .card { 
            background: white; 
            padding: 24px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); 
            max-width: 450px; 
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        ul { padding-left: 20px; margin-top: 12px; }
        li { margin-bottom: 6px; color: #555; }
        .error { color: #d9534f; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Timestamp Logger</h2>
        <button onclick="saveTime()">Save Current Time</button>
        <h3>Saved Records:</h3>
        <ul id="records-list">Loading records...</ul>
    </div>

    <script>
        async function fetchRecords() {
            const list = document.getElementById('records-list');
            try {
                const response = await fetch('/api/records');
                if (!response.ok) throw new Error('Failed to fetch records');
                
                const records = await response.json();
                list.innerHTML = '';
                
                if (records.length === 0) {
                    list.innerHTML = '<li>No records found yet.</li>';
                    return;
                }

                records.forEach(r => {
                    const li = document.createElement('li');
                    li.textContent = `Record #${r.id} saved at: ${r.saved_at}`;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error('Error fetching records:', err);
                list.innerHTML = '<li class="error">Could not connect to backend API.</li>';
            }
        }

        async function saveTime() {
            try {
                const response = await fetch('/api/records', { method: 'POST' });
                if (!response.ok) throw new Error('Failed to save record');
                fetchRecords();
            } catch (err) {
                console.error('Error saving time:', err);
                alert('Failed to save time record.');
            }
        }

        // Initial fetch on page load
        fetchRecords();
    </script>
</body>
</html>
